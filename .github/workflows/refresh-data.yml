name: Refresh player data

# Keeps players + rankings current. Daily is sufficient per docs/data/updates.md;
# workflow_dispatch allows manual runs.
on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily
  workflow_dispatch:

# Avoid overlapping runs if a previous one is still going.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh players
        run: python scripts/seed_supabase.py --year 2026

      - name: Refresh rankings
        run: python scripts/seed_rankings.py --scoring half
